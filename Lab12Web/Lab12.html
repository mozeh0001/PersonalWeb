<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Portal Recreation</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            background-color: #000;
            color: #fff;
        }

        div.emscripten {
            text-align: center;
        }

        div.emscripten_border {
            border: 1px solid #000;
            background-color: #000;
        }

        canvas.emscripten {
            border: 0 none;
            background-color: #000;
        }

        .spinner {
            height: 30px;
            width: 30px;
            margin: 20px auto 10px;
            display: block;

            animation: rotation .8s linear infinite;

            border-left: 5px solid #ebebeb;
            border-right: 5px solid #ebebeb;
            border-bottom: 5px solid #ebebeb;
            border-top: 5px solid #787878;

            border-radius: 100%;
            background-color: #bdd72e;
        }

        @keyframes rotation {
            from {
                transform: rotate(0);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #status {
            display: block;
            text-align: center;
            font-weight: 700;
            color: #fff;
            background-color: #000;
            padding: 5px;
        }

        #progress {
            height: 20px;
            width: 300px;
        }

        #controls {
            display: block;
            float: none;
            width: 100%;
            box-sizing: border-box;

            text-align: center;

            padding: 12px 0;
            margin: 0;

            background-color: #000;
            color: #fff;
        }

        #controls label {
            margin-right: 15px;
        }

        #output {
            width: 100%;
            height: 200px;

            box-sizing: border-box;

            margin: 10px auto 0;

            border: 0;

            display: block;

            background-color: #000;
            color: #fff;

            font-family: 'Lucida Console', Monaco, monospace;

            outline: 0;
        }
    </style>
</head>


<body>


    <!-- LOADING -->

    <div
        class="spinner"
        id="spinner">
    </div>


    <div
        class="emscripten"
        id="status">

        Downloading...

    </div>


    <div class="emscripten">

        <progress
            hidden
            id="progress"
            max="100"
            value="0">
        </progress>

    </div>



    <!-- CONTROLS AT TOP -->

    <div id="controls">

        <label>

            <input
                type="checkbox"
                id="resize">

            Resize canvas

        </label>


        <label>

            <input
                type="checkbox"
                id="pointerLock"
                checked>

            Lock/hide mouse pointer

        </label>


        <input
            type="button"
            onclick="goFullscreen()"
            value="Fullscreen">

    </div>



    <!-- PORTAL GAME -->

    <div class="emscripten_border">

        <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1">
        </canvas>

    </div>



    <!-- CONSOLE OUTPUT -->

    <textarea
        id="output"
        rows="8">
    </textarea>



    <!-- FULLSCREEN -->

    <script>

        function goFullscreen() {

            const canvas =
                document.getElementById("canvas");


            if (canvas.requestFullscreen) {

                canvas.requestFullscreen();

            } else if (canvas.webkitRequestFullscreen) {

                canvas.webkitRequestFullscreen();

            }

        }

    </script>



    <!-- EMSCRIPTEN -->

    <script>

        var statusElement =
            document.getElementById("status");

        var progressElement =
            document.getElementById("progress");

        var spinnerElement =
            document.getElementById("spinner");

        var canvasElement =
            document.getElementById("canvas");

        var outputElement =
            document.getElementById("output");



        if (outputElement) {

            outputElement.value = "";

        }



        canvasElement.addEventListener(

            "webglcontextlost",

            function (event) {

                alert(
                    "WebGL context lost. You will need to reload the page."
                );

                event.preventDefault();

            },

            false

        );



        var setStatus =
            function (text) {


                if (!setStatus.last) {

                    setStatus.last = {

                        time: Date.now(),

                        text: ""

                    };

                }



                if (text === setStatus.last.text) {

                    return;

                }



                var match =
                    text.match(
                        /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/
                    );


                var now =
                    Date.now();



                if (
                    match &&
                    now - setStatus.last.time < 30
                ) {

                    return;

                }



                setStatus.last.time =
                    now;


                setStatus.last.text =
                    text;



                if (match) {

                    text =
                        match[1];


                    progressElement.value =
                        100 * parseInt(match[2]);


                    progressElement.max =
                        100 * parseInt(match[4]);


                    progressElement.hidden =
                        false;


                    spinnerElement.hidden =
                        false;

                } else {

                    progressElement.value =
                        null;


                    progressElement.max =
                        null;


                    progressElement.hidden =
                        true;


                    if (!text) {

                        spinnerElement.style.display =
                            "none";

                    }

                }



                statusElement.innerHTML =
                    text;

            };



        var Module = {


            print: function (...args) {

                console.log(...args);


                if (outputElement) {

                    var text =
                        args.join(" ");


                    outputElement.value +=
                        text + "\n";


                    outputElement.scrollTop =
                        outputElement.scrollHeight;

                }

            },


            canvas:
                canvasElement,


            setStatus:
                setStatus,


            totalDependencies:
                0,


            monitorRunDependencies:
                function (left) {


                    this.totalDependencies =
                        Math.max(
                            this.totalDependencies,
                            left
                        );


                    setStatus(

                        left

                            ? "Preparing... (" +
                              (this.totalDependencies - left) +
                              "/" +
                              this.totalDependencies +
                              ")"

                            : "All downloads complete."

                    );

                }

        };



        setStatus(
            "Downloading..."
        );



        window.onerror =
        window.onunhandledrejection =
            function () {


                setStatus(
                    "Exception thrown, see JavaScript console"
                );


                spinnerElement.style.display =
                    "none";


                setStatus =
                    function (text) {

                        if (text) {

                            console.error(
                                "[post-exception status] " +
                                text
                            );

                        }

                    };

            };

    </script>



    <script
        async
        src="Lab12.js">
    </script>


</body>

</html>
