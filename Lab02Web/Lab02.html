<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Asteroids Recreation</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            background-color: #000;
            color: #fff;
        }

        textarea.emscripten {
            font-family: monospace;
            width: 80%;
            background-color: #000;
            color: #fff;
        }

        div.emscripten {
            text-align: center;
            background-color: #000;
        }

        div.emscripten_border {
            border: 1px solid #000;
        }

        canvas.emscripten {
            border: 0 none;
            background-color: #000;
        }

        #controls {
            text-align: center;
            padding: 12px 0;
            background-color: #000;
            color: #fff;
        }

        .spinner {
            height: 50px;
            width: 50px;
            margin: 10px auto;

            animation: rotation 0.8s linear infinite;

            border-left: 10px solid #0096f0;
            border-right: 10px solid #0096f0;
            border-bottom: 10px solid #0096f0;
            border-top: 10px solid #6400c8;

            border-radius: 100%;
            background-color: #c864fa;
        }

        @keyframes rotation {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <figure id="spinner" style="overflow: visible;">
        <div class="spinner"></div>

        <center style="margin-top: 0.5em;">
            <strong>Loading Asteroids...</strong>
        </center>
    </figure>

    <div class="emscripten" id="status">
        Downloading...
    </div>

    <div class="emscripten">
        <progress hidden id="progress" max="100" value="0"></progress>
    </div>

    <!-- CONTROLS -->
    <div id="controls">

        <input
            type="checkbox"
            id="resize">

        Resize canvas

        <input
            type="checkbox"
            id="pointerLock"
            checked>

        Lock/hide mouse pointer

        &nbsp;&nbsp;&nbsp;

        <input
            type="button"
            onclick="goFullscreen()"
            value="Fullscreen">

    </div>

    <!-- GAME CANVAS -->
    <div class="emscripten_border">

        <canvas
            class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1">
        </canvas>

    </div>

    <textarea
        class="emscripten"
        id="output"
        rows="8">
    </textarea>

    <script>

        function goFullscreen() {

            const canvas = document.getElementById("canvas");

            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            }
            else if (canvas.webkitRequestFullscreen) {
                canvas.webkitRequestFullscreen();
            }

            canvas.focus();
        }


        var statusElement =
            document.getElementById("status");

        var progressElement =
            document.getElementById("progress");

        var spinnerElement =
            document.getElementById("spinner");


        var Module = {

            preRun: [],

            postRun: [],


            print: (function () {

                var element =
                    document.getElementById("output");

                if (element) {
                    element.value = "";
                }

                return function (text) {

                    if (arguments.length > 1) {

                        text =
                            Array.prototype
                                .slice.call(arguments)
                                .join(" ");
                    }

                    console.log(text);

                    if (element) {

                        element.value += text + "\n";

                        element.scrollTop =
                            element.scrollHeight;
                    }
                };

            })(),


            canvas: (function () {

                var canvas =
                    document.getElementById("canvas");

                canvas.addEventListener(
                    "webglcontextlost",

                    function (e) {

                        alert(
                            "WebGL context lost. You will need to reload the page."
                        );

                        e.preventDefault();
                    },

                    false
                );

                return canvas;

            })(),


            setStatus: function (text) {

                if (!Module.setStatus.last) {

                    Module.setStatus.last = {
                        time: Date.now(),
                        text: ""
                    };
                }

                if (text === Module.setStatus.last.text) {
                    return;
                }

                var m =
                    text.match(
                        /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/
                    );

                var now = Date.now();

                if (
                    m &&
                    now - Module.setStatus.last.time < 30
                ) {
                    return;
                }

                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;


                if (m) {

                    text = m[1];

                    progressElement.value =
                        100 * parseInt(m[2]);

                    progressElement.max =
                        100 * parseInt(m[4]);

                    progressElement.hidden = false;
                    spinnerElement.hidden = false;

                }
                else {

                    progressElement.value = null;
                    progressElement.max = null;
                    progressElement.hidden = true;

                    if (!text) {
                        spinnerElement.hidden = true;
                    }
                }

                statusElement.innerHTML = text;
            },


            totalDependencies: 0,


            monitorRunDependencies: function (left) {

                this.totalDependencies =
                    Math.max(
                        this.totalDependencies,
                        left
                    );

                Module.setStatus(

                    left

                        ? "Preparing... (" +
                          (this.totalDependencies - left) +
                          "/" +
                          this.totalDependencies +
                          ")"

                        : "All downloads complete."
                );
            }
        };


        Module.setStatus("Downloading...");


        window.onerror = function () {

            Module.setStatus(
                "Exception thrown, see JavaScript console"
            );

            spinnerElement.style.display = "none";

            Module.setStatus = function (text) {

                if (text) {

                    console.error(
                        "[post-exception status] " + text
                    );
                }
            };
        };

    </script>

    <script async src="Lab02.js"></script>

</body>

</html>
